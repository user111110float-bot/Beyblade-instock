name: 每日收集陀螺到貨資訊

on:
  schedule:
    # 每 15 分鐘查一次網店庫存（快閃常常幾分鐘就賣完）；台灣時間 08:00、18:00 會把所有來源完整搜一遍
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
  push:
    branches: [claude/beyblade-arrival-notifications-c5xyzk, main]
    paths: ["docs/**", "scraper/**", "shops.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 收集資料
        run: python scraper/collect.py
        env:
          # 選填：在 Settings → Secrets and variables → Actions 設定後才會啟用
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # 手動執行或改程式時一律完整收集
          FULL: ${{ github.event_name != 'schedule' && '1' || '' }}

      - name: 存回 repo（保留歷史紀錄）
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json data/stock.json docs/data.json LATEST.md
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 更新"
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 資料沒變（例如庫存沒動）就不用重新部署網頁
      - if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deploy
        uses: actions/deploy-pages@v4
