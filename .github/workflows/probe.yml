name: 臨時探測（看完會刪）
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126.0 Mobile Safari/537.36"
          for u in 'https://shop.funbox.com.tw/categories/XI/KB/products.json?limit=3' 'https://shop.funbox.com.tw/collections/XIKB/products.json?limit=3' 'https://shop.funbox.com.tw/categories/XI/KB.json' ; do
            echo "== $u"; curl -sSL -A "$UA" -w "\nHTTP %{http_code}\n" "$u" | head -c 900; echo; done
          curl -sSL -A "$UA" -o f.html 'https://shop.funbox.com.tw/categories/XI/KB'
          echo "== funbox product links"; grep -oE 'href="/products/[^"]{1,100}"' f.html | sort -u | head -5; grep -oE 'href="/products/[^"]{1,100}"' f.html | sort -u | wc -l
          echo "== funbox collection handles"; grep -oE '(collection_id|collectionId|handle)["=: ]+[A-Za-z0-9_-]{2,40}' f.html | sort | uniq -c | sort -rn | head
          echo "== funbox json hints"; grep -oE '"(inventory_quantity|available|sold_out|variants)"' f.html | sort | uniq -c
          echo "== funbox product block"; python3 -c "
          import re;h=open('f.html',encoding='utf-8').read()
          i=h.find('已售完'); print(re.sub(r'\s+',' ',h[max(0,i-2500):i+300]))"
          echo "######## PCHOME list with Name"
          for off in 1 37; do curl -sSL -A "$UA" "https://ecapi-cdn.pchome.com.tw/cdn/ecshop/prodapi/v2/store/DEASSW/prod&offset=$off&limit=36&fields=Id,Name,Nick" | python3 -c "
          import sys,json;d=json.load(sys.stdin);print(len(d));[print(x['Id'],x.get('Name','')[:60]) for x in d[:40]]"; done
