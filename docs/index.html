<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陀螺到貨雷達</title>
<meta name="theme-color" content="#0f62fe">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="陀螺雷達">
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1b1d21;--muted:#6b7280;--line:#e5e7eb;--accent:#0f62fe;--tp:#d6336c;--ntp:#0ca678;--warn:#f59f00}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--fg:#e8eaed;--muted:#9aa0a6;--line:#2c313a;--accent:#5b8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
#install{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:6px 12px;font-size:13px}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:14px}
#regions button{font-size:13px;padding:4px 11px}
#regions button .n{opacity:.6;margin-left:3px;font-size:11px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:12px 16px 40px;max-width:720px;margin:0 auto}
.day{font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.card a.t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;line-height:1.4;color:inherit;text-decoration:none}
.card details{margin:6px 0 0;font-size:13px}
.card details a{color:var(--accent);text-decoration:none}
.card details ul{margin:4px 0 0;padding-left:18px}
.card .s{color:var(--muted);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:12px}
.tag{border-radius:6px;padding:1px 7px;background:var(--line);color:var(--fg)}
.tag.tp{background:var(--tp);color:#fff}.tag.ntp{background:var(--ntp);color:#fff}.tag.new{background:var(--warn);color:#000}
.tag.shop{background:var(--accent);color:#fff}
.src{color:var(--muted)}
.card.off{opacity:.55}
.empty{text-align:center;color:var(--muted);padding:40px 0}
details{margin-top:24px;color:var(--muted);font-size:13px}
details li.bad{color:var(--tp)}
details li.off{opacity:.6}
</style>
</head>
<body>
<header>
  <div class="top"><h1>🌀 陀螺到貨雷達</h1><button id="install" hidden>📲 安裝 App</button></div>
  <div class="meta" id="meta">載入中…</div>
  <div class="tabs" id="regions"></div>
  <div class="tabs" id="tabs">
    <button data-f="all">全部消息</button>
    <button data-f="arrival">📦 到貨／補貨</button>
    <button data-f="social">💬 社群</button>
    <button data-f="stock">🛒 網店庫存</button>
    <button data-f="event">🏆 比賽</button>
    <button data-f="resale">♻️ 二手</button>
    <button data-f="new">🆕 今天新增</button>
  </div>
</header>
<main>
  <div id="list"></div>
  <details><summary>資料來源狀態</summary><ul id="sources"></ul></details>
</main>
<script>
const CITIES = ['基隆','台北','新北','桃園','新竹','苗栗','台中','彰化','南投','雲林','嘉義',
  '台南','高雄','屏東','宜蘭','花蓮','台東','澎湖','金門','連江'];
const ALL = '全台';
const NONE = '未標地區';
// 二手轉售、比賽公告各自只在自己的分頁出現，不混進到貨消息
const plain = i => !i.resale && !i.event;
const FILTERS = {
  all: plain,
  arrival: i => plain(i) && i.arrival.length > 0,
  social: i => plain(i) && (i.social ?? /^(PTT|Dcard|YouTube|Threads|Facebook)/.test(i.source)),
  event: i => !!i.event && !i.resale,
  resale: i => !!i.resale,
  new: (i, d) => plain(i) && isNew(i, d),
  stock: () => false,  // 網店庫存另外顯示，見 renderStock
};
const load = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let data, filter = load('filter', 'all'), picked = load('regions', ['台北', '新北', NONE]);
if (!FILTERS[filter]) filter = 'all';

const isNew = (i, d) => i.first_seen.slice(0, 10) === d.updated.slice(0, 10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 沒標縣市、但是連鎖通路的消息（例如超商全台開賣）每個縣市都看得到
// 網店補貨全台都買得到，也一樣
const online = i => i.kind === 'stock';
const nationwide = i => online(i) || (!i.region.length && i.stores.length > 0);
const inRegion = i => picked.includes(ALL) || nationwide(i) || i.region.some(r => picked.includes(r))
  || (picked.includes(NONE) && !i.region.length);

function renderRegions() {
  const count = c => data.items.filter(i => c === ALL || i.region.includes(c) || nationwide(i)
    || (c === NONE && !i.region.length)).length;
  // 有消息的縣市排前面，其餘照北到南
  const cities = [...CITIES].sort((a, b) => (count(b) > 0) - (count(a) > 0));
  document.getElementById('regions').innerHTML = [ALL, NONE, ...cities].map(c =>
    `<button data-c="${c}" class="${picked.includes(c) ? 'on' : ''}">${c}<span class="n">${count(c)}</span></button>`).join('');
}

// 網店庫存：直接讀店家網店的商品庫存，跟縣市無關
function renderStock() {
  const list = document.getElementById('list');
  const stock = data.stock || [];
  if (!stock.length) { list.innerHTML = '<div class="empty">還沒有監控的網店</div>'; return; }
  const ago = t => t ? t.replace('T', ' ').slice(5, 16) : '';
  let html = '', shop = '';
  for (const p of stock) {
    if (p.shop !== shop) {
      shop = p.shop;
      const n = stock.filter(x => x.shop === shop && x.in_stock).length;
      html += `<div class="day">🛒 ${esc(shop)}　有貨 ${n} 項</div>`;
    }
    const when_ = t => t.slice(5, 16).replace('-', '/').replace('T', ' ');
    const state = p.upcoming ? `<span class="tag new">⏰ ${when_(p.sell_from)} 開賣</span>`
      : !p.in_stock ? '<span class="tag">已售完／未開賣</span>'
      : p.qty ? `<span class="tag ntp">有貨 ${p.qty}</span>` : '<span class="tag ntp">可下單</span>';
    const when = p.restocked_at ? `<span class="src">${ago(p.restocked_at)} 補貨／上架</span>` : '';
    html += `<div class="card${p.in_stock ? '' : ' off'}">
      <a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="tags">${state}${p.price ? `<span class="tag">$${p.price}</span>` : ''}${when}</div></div>`;
  }
  list.innerHTML = html;
}

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.f === filter));
  renderRegions();
  if (filter === 'stock') return renderStock();
  const items = data.items.filter(i => inRegion(i) && FILTERS[filter](i, data));
  const list = document.getElementById('list');
  if (!items.length) {
    list.innerHTML = `<div class="empty">${picked.join('、')} 目前沒有這類消息<br>可以點「${ALL}」看看其他地方</div>`;
    return;
  }
  let html = '', day = '';
  for (const i of items) {
    const d = i.date.slice(0, 10);
    if (d !== day) { day = d; html += `<div class="day">${d.replace(/-/g, '/')}</div>`; }
    const tags = [
      ...(isNew(i, data) ? ['<span class="tag new">NEW</span>'] : []),
      ...(i.shop ? [`<span class="tag shop">🏪 ${esc(i.shop)}${i.branch ? ' ' + esc(i.branch) : ''}</span>`] : []),
      ...(online(i) ? ['<span class="tag ntp">🛒 網店</span>']
        : nationwide(i) ? ['<span class="tag ntp">全台通路</span>'] : []),
      ...(i.resale ? ['<span class="tag">二手／轉售</span>'] : []),
      ...i.region.map(r => `<span class="tag ${picked.includes(r) ? 'tp' : ''}">📍${esc(r)}</span>`),
      ...i.stores.map(s => `<span class="tag">${esc(s)}</span>`),
      ...i.arrival.slice(0, 3).map(s => `<span class="tag">${esc(s)}</span>`),
    ].join('');
    const also = i.also?.length
      ? `<details><summary>另有 ${i.also.length} 則相關報導</summary><ul>${i.also.map(a =>
          `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)}</a></li>`).join('')}</ul></details>`
      : '';
    html += `<div class="card">
      <a class="t" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
      ${i.summary ? `<div class="s">${esc(i.summary)}</div>` : ''}
      <div class="tags">${tags}<span class="src">${esc(i.source)}</span></div>${also}</div>`;
  }
  list.innerHTML = html;
}

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f; save('filter', filter); render();
});

// 縣市可複選；點「全台」看全部，點其他縣市會自動取消「全台」
document.getElementById('regions').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const c = b.dataset.c;
  if (c === ALL) picked = [ALL];
  else {
    picked = picked.filter(x => x !== ALL);
    picked = picked.includes(c) ? picked.filter(x => x !== c) : [...picked, c];
    if (!picked.length) picked = [ALL];
  }
  save('regions', picked); render();
});

// 安裝成 App（PWA）：Chrome 會在可安裝時觸發 beforeinstallprompt，點按鈕就跳出安裝視窗
let installEvt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e; document.getElementById('install').hidden = false;
});
document.getElementById('install').addEventListener('click', async () => {
  if (!installEvt) return;
  installEvt.prompt(); await installEvt.userChoice; installEvt = null;
  document.getElementById('install').hidden = true;
});
window.addEventListener('appinstalled', () => { document.getElementById('install').hidden = true; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

fetch('data.json?' + Date.now()).then(r => r.json()).then(d => {
  data = d;
  const ok = d.sources.filter(s => s.ok).length;
  const on = d.sources.filter(s => s.ok !== null).length;
  document.getElementById('meta').textContent = d.updated
    ? `更新：${d.updated.replace('T', ' ').slice(0, 16)}　今日新增 ${d.new_today} 筆　來源 ${ok}/${on}`
    : '還沒有資料，等第一次自動收集完成';
  document.getElementById('sources').innerHTML = d.sources.map(s => s.ok === null
    ? `<li class="off">${esc(s.name)}：${esc(s.error || '未設定')}</li>`
    : `<li class="${s.ok ? '' : 'bad'}">${esc(s.name)}：${s.ok ? s.count + ' 筆' : '失敗 ' + esc(s.error || '')}</li>`).join('');
  render();
}).catch(() => { document.getElementById('meta').textContent = '資料載入失敗，請稍後再試'; });
</script>
</body>
</html>
