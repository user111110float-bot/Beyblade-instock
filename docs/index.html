<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陀螺到貨雷達</title>
<meta name="theme-color" content="#0f62fe">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="陀螺雷達">
<style>
:root{--on:#1c7ed6;--st:#f76707;--bg:#f5f6f8;--card:#fff;--fg:#1b1d21;--muted:#6b7280;--line:#e5e7eb;--accent:#0f62fe;--tp:#d6336c;--ntp:#0ca678;--warn:#f59f00}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--fg:#e8eaed;--muted:#9aa0a6;--line:#2c313a;--accent:#5b8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
#install{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:6px 12px;font-size:13px}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:14px}
#regions button{font-size:13px;padding:4px 11px}
#regions button .n{opacity:.6;margin-left:3px;font-size:11px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:12px 16px 40px;max-width:720px;margin:0 auto}
.day{font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.card a.t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;line-height:1.4;color:inherit;text-decoration:none}
.card details{margin:6px 0 0;font-size:13px}
.card details a{color:var(--accent);text-decoration:none}
.card details ul{margin:4px 0 0;padding-left:18px}
.card .s{color:var(--muted);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:12px}
.tag{border-radius:6px;padding:1px 7px;background:var(--line);color:var(--fg)}
.tag.tp{background:var(--tp);color:#fff}.tag.ntp{background:var(--ntp);color:#fff}.tag.new{background:var(--warn);color:#000}
.tag.shop{background:var(--accent);color:#fff}
.src{color:var(--muted)}
.card.off{opacity:.55}
.tag.on{background:var(--on);color:#fff}.tag.st{background:var(--st);color:#fff}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.cal-head b{font-size:17px}
.cal-head button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;width:40px;height:34px;font-size:18px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-bottom:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:middle}
.dot.on{background:var(--on)}.dot.st{background:var(--st)}.dot.un{background:var(--muted)}
.dot.plan{background:none;border:2px solid var(--warn);width:6px;height:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.cal button{min-width:0;overflow:hidden;aspect-ratio:1;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;
  padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:14px}
.cal button.blank{visibility:hidden}
.cal button.today{border-color:var(--accent);font-weight:700}
.cal button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal button.sel .dot{box-shadow:0 0 0 1.5px #fff}
.cal .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:10px}
.cal .dot{margin:0;width:7px;height:7px}.cal .dot.plan{width:5px;height:5px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
details{margin-top:24px;color:var(--muted);font-size:13px}
details li.bad{color:var(--tp)}
details li.off{opacity:.6}
</style>
</head>
<body>
<header>
  <div class="top"><h1>🌀 陀螺到貨雷達</h1><button id="install" hidden>📲 安裝 App</button></div>
  <div class="meta" id="meta">載入中…</div>
  <div class="tabs" id="regions"></div>
  <div class="tabs" id="tabs">
    <button data-f="now">🔥 現在</button>
    <button data-f="all">全部消息</button>
    <button data-f="calendar">📅 日曆</button>
    <button data-f="arrival">📦 到貨／補貨</button>
    <button data-f="social">💬 社群</button>
    <button data-f="stock">🛒 網店庫存</button>
    <button data-f="event">🏆 比賽</button>
    <button data-f="resale">♻️ 二手</button>
    <button data-f="new">🆕 今天新增</button>
  </div>
</header>
<main>
  <div id="list"></div>
  <details><summary>資料來源狀態</summary><ul id="sources"></ul></details>
</main>
<script>
const CITIES = ['基隆','台北','新北','桃園','新竹','苗栗','台中','彰化','南投','雲林','嘉義',
  '台南','高雄','屏東','宜蘭','花蓮','台東','澎湖','金門','連江'];
const ALL = '全台';
const NONE = '未標地區';
// 二手轉售、比賽公告各自只在自己的分頁出現，不混進到貨消息
const plain = i => !i.resale && !i.event;
const FILTERS = {
  all: plain,
  arrival: i => plain(i) && i.arrival.length > 0,
  social: i => plain(i) && (i.social ?? /^(PTT|Dcard|YouTube|Threads|Facebook)/.test(i.source)),
  event: i => !!i.event && !i.resale,
  resale: i => !!i.resale,
  new: (i, d) => plain(i) && isNew(i, d),
  stock: () => false,  // 網店庫存另外顯示，見 renderStock
  calendar: () => false,  // 日曆另外顯示，見 renderCalendar
  now: () => false,  // 首頁另外顯示，見 renderNow
};
const load = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let data, filter = load('filter', 'now'), picked = load('regions', ['台北', '新北', NONE]);
// 改版後第一次打開，一律從「🔥 現在」開始
if (!load('seenNow', false)) { filter = 'now'; save('seenNow', true); }
if (!FILTERS[filter]) filter = 'now';

const isNew = (i, d) => i.first_seen.slice(0, 10) === d.updated.slice(0, 10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 沒標縣市、但是連鎖通路的消息（例如超商全台開賣）每個縣市都看得到
// 網店補貨全台都買得到，也一樣
const online = i => i.kind === 'stock';
const nationwide = i => online(i) || (!i.region.length && i.stores.length > 0);
const inRegion = i => picked.includes(ALL) || nationwide(i) || i.region.some(r => picked.includes(r))
  || (picked.includes(NONE) && !i.region.length);

function renderRegions() {
  const count = c => data.items.filter(i => c === ALL || i.region.includes(c) || nationwide(i)
    || (c === NONE && !i.region.length)).length;
  // 有消息的縣市排前面，其餘照北到南
  const cities = [...CITIES].sort((a, b) => (count(b) > 0) - (count(a) > 0));
  document.getElementById('regions').innerHTML = [ALL, NONE, ...cities].map(c =>
    `<button data-c="${c}" class="${picked.includes(c) ? 'on' : ''}">${c}<span class="n">${count(c)}</span></button>`).join('');
}

// 網店庫存：直接讀店家網店的商品庫存，跟縣市無關
function renderStock() {
  const list = document.getElementById('list');
  const stock = data.stock || [];
  if (!stock.length) { list.innerHTML = '<div class="empty">還沒有監控的網店</div>'; return; }
  const ago = t => t ? t.replace('T', ' ').slice(5, 16) : '';
  let html = '', shop = '';
  for (const p of stock) {
    if (p.shop !== shop) {
      shop = p.shop;
      const n = stock.filter(x => x.shop === shop && x.in_stock).length;
      html += `<div class="day">🛒 ${esc(shop)}　有貨 ${n} 項</div>`;
    }
    const when_ = t => t.slice(5, 16).replace('-', '/').replace('T', ' ');
    const state = p.upcoming ? `<span class="tag new">⏰ ${when_(p.sell_from)} 開賣</span>`
      : !p.in_stock ? '<span class="tag">已售完／未開賣</span>'
      : p.qty ? `<span class="tag ntp">有貨 ${p.qty}</span>` : '<span class="tag ntp">可下單</span>';
    const when = p.restocked_at ? `<span class="src">${ago(p.restocked_at)} 補貨／上架</span>` : '';
    html += `<div class="card${p.in_stock ? '' : ' off'}">
      <a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="tags">${state}${p.price ? `<span class="tag">$${p.price}</span>` : ''}${when}</div></div>`;
  }
  list.innerHTML = html;
}

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.f === filter));
  renderRegions();
  if (filter === 'stock') return renderStock();
  if (filter === 'now') return renderNow();
  if (filter === 'calendar') return renderCalendar();
  const items = data.items.filter(i => inRegion(i) && FILTERS[filter](i, data));
  const list = document.getElementById('list');
  if (!items.length) {
    list.innerHTML = `<div class="empty">${picked.join('、')} 目前沒有這類消息<br>可以點「${ALL}」看看其他地方</div>`;
    return;
  }
  let html = '', day = '';
  for (const i of items) {
    const d = i.date.slice(0, 10);
    if (d !== day) { day = d; html += `<div class="day">${d.replace(/-/g, '/')}</div>`; }
    html += cardHtml(i);
  }
  list.innerHTML = html;
}

function cardHtml(i, extra = []) {
    const tags = [...extra,
      ...(isNew(i, data) ? ['<span class="tag new">NEW</span>'] : []),
      ...(i.shop ? [`<span class="tag shop">🏪 ${esc(i.shop)}${i.branch ? ' ' + esc(i.branch) : ''}</span>`] : []),
      ...(online(i) ? ['<span class="tag ntp">🛒 網店</span>']
        : nationwide(i) ? ['<span class="tag ntp">全台通路</span>'] : []),
      ...(i.resale ? ['<span class="tag">二手／轉售</span>'] : []),
      ...i.region.map(r => `<span class="tag ${picked.includes(r) ? 'tp' : ''}">📍${esc(r)}</span>`),
      ...i.stores.map(s => `<span class="tag">${esc(s)}</span>`),
      ...i.arrival.slice(0, 3).map(s => `<span class="tag">${esc(s)}</span>`),
    ].join('');
    const also = i.also?.length
      ? `<details><summary>另有 ${i.also.length} 則相關報導</summary><ul>${i.also.map(a =>
          `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)}</a></li>`).join('')}</ul></details>`
      : '';
    return `<div class="card">
      <a class="t" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
      ${i.summary ? `<div class="s">${esc(i.summary)}</div>` : ''}
      <div class="tags">${tags}<span class="src">${esc(i.source)}</span></div>${also}</div>`;
}

// ---- 日曆：哪天有陀螺上架／實體販售，線上（藍）、實體（橘）分開標 ----
const CHAN = {
  online: {cls: 'on', label: '🛒 線上'}, store: {cls: 'st', label: '🏪 實體'},
};
const isSale = i => plain(i) && (i.kind === 'stock' || i.arrival.length > 0 || (i.sale_dates || []).length > 0);
const chanOf = i => i.channel || (i.kind === 'stock' ? 'online' : null);
let calMonth = null, calDay = null;

function calEntries() {
  const map = {};  // 'YYYY-MM-DD' → [{i, planned}]
  const add = (d, i, planned) => {
    const list = (map[d] ||= []);
    if (!list.some(e => e.i.url === i.url)) list.push({i, planned});
  };
  for (const i of data.items) {
    if (!inRegion(i) || !isSale(i)) continue;
    const posted = i.date.slice(0, 10);
    add(posted, i, false);
    // 標題寫的開賣日（例如「11/21開賣」）也標上去
    for (const d of i.sale_dates || []) if (d !== posted) add(d, i, true);
  }
  // 網店裡還沒開賣的商品：標在開賣那天
  for (const p of data.stock || []) {
    if (!p.upcoming) continue;
    add(p.sell_from.slice(0, 10), {
      title: `【${p.shop}】${p.title}`, url: p.url, summary: '', source: `網店｜${p.shop}`,
      kind: 'stock', channel: 'online', region: [], stores: [], arrival: ['開賣'], date: p.sell_from,
      first_seen: p.first_seen || '',
    }, true);
  }
  return map;
}

function chanTags(i, planned) {
  const c = chanOf(i);
  return [
    ...(planned ? ['<span class="tag new">⏰ 預計開賣</span>'] : []),
    ...(c === 'online' || c === 'both' ? [`<span class="tag on">${CHAN.online.label}</span>`] : []),
    ...(c === 'store' || c === 'both' ? [`<span class="tag st">${CHAN.store.label}</span>`] : []),
  ];
}

// ---- 首頁「🔥 現在」：只看現在買得到的、即將開賣的；過去的紀錄放在其他分頁 ----
const BEY_CODE = /\b(?:BX|UX|CX|BXG)-?\d+/i;
function renderNow() {
  const list = document.getElementById('list');
  const today = data.updated.slice(0, 10);
  const ago = t => {
    const m = Math.round((new Date(data.updated) - new Date(t)) / 60000);
    return m < 60 ? `${Math.max(m, 1)} 分鐘前` : m < 1440 ? `${Math.round(m / 60)} 小時前` : `${Math.round(m / 1440)} 天前`;
  };
  let html = '';

  // 1. 現在網店買得到的陀螺本體（每 15 分鐘檢查）
  const live = (data.stock || []).filter(p => p.in_stock && BEY_CODE.test(p.title) && !/APP兌換|兌換票券/.test(p.title));
  html += `<div class="day">🛒 現在網店買得到　${live.length} 項</div>`;
  html += live.length ? live.map(p => `<div class="card">
      <a class="t" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="tags"><span class="tag on">🛒 ${esc(p.shop)}</span>
      ${p.qty ? `<span class="tag ntp">有貨 ${p.qty}</span>` : '<span class="tag ntp">可下單</span>'}
      ${p.price ? `<span class="tag">$${p.price}</span>` : ''}
      ${p.restocked_at ? `<span class="tag new">${ago(p.restocked_at)}補貨／上架</span>` : ''}</div></div>`).join('')
    : '<div class="empty" style="padding:14px 0">監控的網店目前都沒有陀螺現貨</div>';

  // 2. 即將開賣（今天以後），照日期排
  const entries = calEntries();
  const days = Object.keys(entries).filter(d => d >= today).sort()
    .filter(d => entries[d].some(e => e.planned || d === today));
  const n = days.reduce((a, d) => a + entries[d].filter(e => e.planned || d === today).length, 0);
  html += `<div class="day">⏰ 即將開賣　${n} 則</div>`;
  if (!days.length) html += '<div class="empty" style="padding:14px 0">目前沒有公布未來的開賣日</div>';
  for (const d of days) {
    const [yy, mm, dd] = d.split('-').map(Number);
    const wd = '日一二三四五六'[new Date(Date.UTC(yy, mm - 1, dd)).getUTCDay()];  // 用 UTC 算，不受手機時區影響
    html += `<div class="src" style="margin:8px 0 4px">📅 ${d.slice(5).replace('-', '/')}（${wd}）${d === today ? '　今天' : ''}</div>`;
    html += entries[d].filter(e => e.planned || d === today).map(e => cardHtml(e.i, chanTags(e.i, e.planned))).join('');
  }

  // 3. 24 小時內抓到的到貨消息（Facebook／新聞平均晚 1～2 天，僅供參考）
  const recent = data.items.filter(i => inRegion(i) && isSale(i) && i.kind !== 'stock'
    && new Date(data.updated) - new Date(i.first_seen) < 864e5);
  html += `<div class="day">🆕 24 小時內抓到的到貨消息　${recent.length} 則</div>
    <div class="src" style="margin-bottom:6px">Facebook、新聞要等 Google 收錄，平均晚 1～2 天，多半已經賣完，參考就好</div>`;
  html += recent.slice(0, 15).map(i => cardHtml(i, chanTags(i, false))).join('');
  list.innerHTML = html;
}

function renderCalendar() {
  const list = document.getElementById('list');
  const today = data.updated.slice(0, 10);
  const entries = calEntries();
  // 預設選今天；今天還沒消息就選最近一個有消息的日子
  calDay ||= entries[today] ? today : Object.keys(entries).filter(d => d <= today).sort().pop() || today;
  calMonth ||= calDay.slice(0, 7);
  const [y, m] = calMonth.split('-').map(Number);
  const firstWd = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  const pad = n => String(n).padStart(2, '0');

  let html = `<div class="cal-head"><button data-nav="-1" aria-label="上個月">‹</button>
    <b>${y} 年 ${m} 月</b><button data-nav="1" aria-label="下個月">›</button></div>
    <div class="legend"><span><i class="dot on"></i>線上（網店／官網）</span><span><i class="dot st"></i>實體（門市／現場）</span>
    <span><i class="dot un"></i>未分類</span><span><i class="dot plan"></i>預計開賣</span></div>
    <div class="cal">${'日一二三四五六'.split('').map(w => `<div class="wd">${w}</div>`).join('')}`;
  for (let k = 0; k < firstWd; k++) html += '<button class="blank" tabindex="-1"></button>';
  for (let d = 1; d <= days; d++) {
    const key = `${calMonth}-${pad(d)}`;
    const es = entries[key] || [];
    const has = c => es.some(e => { const x = chanOf(e.i); return c === 'un' ? !x : x === c || x === 'both'; });
    const dots = [has('online') && 'on', has('store') && 'st', has('un') && 'un', es.some(e => e.planned) && 'plan']
      .filter(Boolean).map(c => `<i class="dot ${c}"></i>`).join('');
    const cls = [key === today && 'today', key === calDay && 'sel'].filter(Boolean).join(' ');
    html += `<button data-d="${key}" class="${cls}" aria-label="${m}月${d}日 ${es.length} 則">${d}<span class="dots">${dots}</span></button>`;
  }
  html += '</div>';

  const sel = (entries[calDay] || []).sort((a, b) => a.planned - b.planned);
  html += `<div class="day">${calDay.replace(/-/g, '/')}　${sel.length ? sel.length + ' 則' : '沒有上架或販售消息'}</div>`;
  html += sel.map(e => cardHtml(e.i, chanTags(e.i, e.planned))).join('');
  list.innerHTML = html;
}

document.getElementById('list').addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]'), day = e.target.closest('[data-d]');
  if (nav) {
    const [y, m] = calMonth.split('-').map(Number);
    const t = new Date(y, m - 1 + Number(nav.dataset.nav), 1);
    calMonth = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}`;
    renderCalendar();
  } else if (day) {
    calDay = day.dataset.d; renderCalendar();
  }
});

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f; save('filter', filter); render();
});

// 縣市可複選；點「全台」看全部，點其他縣市會自動取消「全台」
document.getElementById('regions').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const c = b.dataset.c;
  if (c === ALL) picked = [ALL];
  else {
    picked = picked.filter(x => x !== ALL);
    picked = picked.includes(c) ? picked.filter(x => x !== c) : [...picked, c];
    if (!picked.length) picked = [ALL];
  }
  save('regions', picked); render();
});

// 安裝成 App（PWA）：Chrome 會在可安裝時觸發 beforeinstallprompt，點按鈕就跳出安裝視窗
let installEvt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e; document.getElementById('install').hidden = false;
});
document.getElementById('install').addEventListener('click', async () => {
  if (!installEvt) return;
  installEvt.prompt(); await installEvt.userChoice; installEvt = null;
  document.getElementById('install').hidden = true;
});
window.addEventListener('appinstalled', () => { document.getElementById('install').hidden = true; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

fetch('data.json?' + Date.now()).then(r => r.json()).then(d => {
  data = d;
  const ok = d.sources.filter(s => s.ok).length;
  const on = d.sources.filter(s => s.ok !== null).length;
  document.getElementById('meta').textContent = d.updated
    ? `更新：${d.updated.replace('T', ' ').slice(0, 16)}　今日新增 ${d.new_today} 筆　來源 ${ok}/${on}`
    : '還沒有資料，等第一次自動收集完成';
  document.getElementById('sources').innerHTML = d.sources.map(s => s.ok === null
    ? `<li class="off">${esc(s.name)}：${esc(s.error || '未設定')}</li>`
    : `<li class="${s.ok ? '' : 'bad'}">${esc(s.name)}：${s.ok ? s.count + ' 筆' : '失敗 ' + esc(s.error || '')}</li>`).join('');
  render();
}).catch(() => { document.getElementById('meta').textContent = '資料載入失敗，請稍後再試'; });
</script>
</body>
</html>
